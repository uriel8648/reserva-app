<div class="bg-gray-300 p-2 font-bold">Ajuste de Reserva por aplicar</div>
<div class="overflow-x-auto">
    <table class="w-full border-collapse mb-4">
        <thead>
            <tr>
                <th class="border p-2 bg-gray-300">Ramo Contable</th>
                <th class="border p-2 bg-gray-300">Cobertura</th>
                <th class="border p-2 bg-gray-300">Suma Asegurada</th>
                <th class="border p-2 bg-gray-300">Reserva Inicial</th>
                <th class="border p-2 bg-gray-300">Ajustes(+)</th>
                <th class="border p-2 bg-gray-300">Pagos</th>
                <th class="border p-2 bg-gray-300">Saldo</th>
                <th class="border p-2 bg-gray-300">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let ajuste of ajustes; let i = index">
                <td class="border p-2"><input type="text" [(ngModel)]="ajuste.ramoContable" class="border border-gray-400 p-1"></td>
                <td class="border p-2"><input type="text" [(ngModel)]="ajuste.cobertura" class="border border-gray-400 p-1"></td>
                <td class="border p-2"><input type="text" [(ngModel)]="ajuste.sumaAsegurada" class="border border-gray-400 p-1"></td>
                <td class="border p-2"><input type="text" [(ngModel)]="ajuste.reservaInicial" class="border border-gray-400 p-1"></td>
                <td class="border p-2"><input type="text" [(ngModel)]="ajuste.ajustes" class="border border-gray-400 p-1"></td>
                <td class="border p-2"><input type="text" [(ngModel)]="ajuste.pagos" class="border border-gray-400 p-1"></td>
                <td class="border p-2"><input type="text" [(ngModel)]="ajuste.saldo" class="border border-gray-400 p-1"></td>
                <td class="border p-2">
                    <button class="bg-red-500 text-white px-2 py-1" (click)="deleteAjuste(ajuste._id)">Eliminar</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div class="flex justify-end mt-4">
    <button class="bg-gray-400 text-black px-4 py-2" (click)="openNewAjusteForm()">Agregar Nuevo Ajuste</button>
</div>

<div *ngIf="showNewAjusteForm" class="mt-4">
    <form [formGroup]="ajusteForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block">Ramo Contable</label>
                <input type="text" formControlName="ramoContable" class="border border-gray-400 p-1 w-full">
            </div>
            <div>
                <label class="block">Cobertura</label>
                <input type="text" formControlName="cobertura" class="border border-gray-400 p-1 w-full">
            </div>
            <div>
                <label class="block">Suma Asegurada</label>
                <input type="text" formControlName="sumaAsegurada" class="border border-gray-400 p-1 w-full">
            </div>
            <div>
                <label class="block">Reserva Inicial</label>
                <input type="text" formControlName="reservaInicial" class="border border-gray-400 p-1 w-full">
            </div>
            <div>
                <label class="block">Ajustes(+)</label>
                <input type="text" formControlName="ajustes" class="border border-gray-400 p-1 w-full">
            </div>
            <div>
                <label class="block">Pagos</label>
                <input type="text" formControlName="pagos" class="border border-gray-400 p-1 w-full">
            </div>
            <div>
                <label class="block">Saldo</label>
                <input type="text" formControlName="saldo" class="border border-gray-400 p-1 w-full">
            </div>
        </div>
        <div class="flex justify-end mt-4">
            <button type="submit" class="bg-blue-500 text-white px-4 py-2">Guardar</button>
            <button type="button" class="bg-gray-500 text-white px-4 py-2 ml-2" (click)="closeNewAjusteForm()">Cancelar</button>
        </div>
    </form>
</div>
